name: Auto Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            
           
            cd /www/wwwroot/mtsnpadangpanjang.sch.id/landingPage-mtsn
            sudo -u www GIT_SSH_COMMAND="ssh -i /root/.ssh/landingpage_mtsn -o IdentitiesOnly=yes" git pull origin main

